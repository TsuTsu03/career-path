name: Keep database awake

# The free MongoDB Atlas cluster pauses after a long stretch with no
# connections, which makes every login fail. /health opens a connection and
# pings the database, so a daily call keeps it active.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        run: curl --fail --silent --show-error --max-time 30 https://carpath-server.vercel.app/health
